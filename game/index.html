<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Difference Hunter — a spot-the-difference game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1026;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: min(1280px, 100vw);
    height: auto;
    image-rendering: auto;
    cursor: crosshair;
  }
  #help {
    color: #9fb3c8;
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="help">Click a difference on either picture &nbsp;·&nbsp; H hint &nbsp;·&nbsp; R restart level &nbsp;·&nbsp; M sound &nbsp;·&nbsp; Enter start</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
